# -----------------------------------------------------
# Key bindings
# name: "Default"
# -----------------------------------------------------

source = ~/.config/hypr/conf/keybindings/override-default.conf

# -----------------------------------------------------
# Key bindings overrides
# name: "Override Default Multiscreen"
# -----------------------------------------------------

# Actions

# Workspaces
unbind = $mainMod, 1 # Unbind for open workspace X
bind = $mainMod, 1, split-workspace, 1 # Open workspace 1

unbind = $mainMod, 2 # Unbind for open workspace X
bind = $mainMod, 2, split-workspace, 2 # Open workspace 2

unbind = $mainMod, 3 # Unbind for open workspace X
bind = $mainMod, 3, split-workspace, 3 # Open workspace 3

unbind = $mainMod, 4 # Unbind for open workspace X
bind = $mainMod, 4, split-workspace, 4 # Open workspace 4

unbind = $mainMod, 5 # Unbind for open workspace X
bind = $mainMod, 5, split-workspace, 5 # Open workspace 5

unbind = $mainMod, 6 # Unbind for open workspace X
bind = $mainMod, 6, split-workspace, 6 # Open workspace 6

unbind = $mainMod, 7 # Unbind for open workspace X
bind = $mainMod, 7, split-workspace, 7 # Open workspace 7

unbind = $mainMod, 8 # Unbind for open workspace X
bind = $mainMod, 8, split-workspace, 8 # Open workspace 8

unbind = $mainMod, 9 # Unbind for open workspace X
bind = $mainMod, 9, split-workspace, 9 # Open workspace 9

unbind = $mainMod, 0 # Unbind for open workspace X
bind = $mainMod, 0, split-workspace, 10 # Open workspace 10

#

unbind = $mainMod SHIFT, 1 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1 # Move active window to workspace 1

unbind = $mainMod SHIFT, 2 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2 # Move active window to workspace 2

unbind = $mainMod SHIFT, 3 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3 # Move active window to workspace 3

unbind = $mainMod SHIFT, 4 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4 # Move active window to workspace 4

unbind = $mainMod SHIFT, 5 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5 # Move active window to workspace 5

unbind = $mainMod SHIFT, 6 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6 # Move active window to workspace 6

unbind = $mainMod SHIFT, 7 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7 # Move active window to workspace 7

unbind = $mainMod SHIFT, 8 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8 # Move active window to workspace 8

unbind = $mainMod SHIFT, 9 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9 # Move active window to workspace 9

unbind = $mainMod SHIFT, 0 # Unbind for move active window to workspace X
bind = $mainMod SHIFT, 0, split-movetoworkspace, 10 # Move active window to workspace 10

#

unbind = $mainMod, Tab # Unbind for open next workspace
bind = $mainMod, Tab, split-workspace, m+1 # Open next workspace

unbind = $mainMod SHIFT, Tab # Unbind for open previous workspace
bind = $mainMod SHIFT, Tab, split-workspace, m-1 # Open previous workspace

#

unbind = $mainMod CTRL, 1 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 1, split-movetoworkspacesilent, 1 # Move active window silent to workspace 1

unbind = $mainMod CTRL, 2 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 2, split-movetoworkspacesilent, 2 # Move active window silent to workspace 2

unbind = $mainMod CTRL, 3 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 3, split-movetoworkspacesilent, 3 # Move active window silent to workspace 3

unbind = $mainMod CTRL, 4 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 4, split-movetoworkspacesilent, 4 # Move active window silent to workspace 4

unbind = $mainMod CTRL, 5 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 5, split-movetoworkspacesilent, 5 # Move active window silent to workspace 5

unbind = $mainMod CTRL, 6 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 6, split-movetoworkspacesilent, 6 # Move active window silent to workspace 6

unbind = $mainMod CTRL, 7 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 7, split-movetoworkspacesilent, 7 # Move active window silent to workspace 7

unbind = $mainMod CTRL, 8 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 8, split-movetoworkspacesilent, 8 # Move active window silent to workspace 8

unbind = $mainMod CTRL, 9 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 9, split-movetoworkspacesilent, 9 # Move active window silent to workspace 9

unbind = $mainMod CTRL, 0 # Unbind for move all windows to workspace X
bind = $mainMod CTRL, 0, split-movetoworkspacesilent, 10 # Move active window silent to workspace 10

#

unbind = $mainMod, mouse_down # Unbind for open next workspace
bind = $mainMod, mouse_down, split-workspace, e+1 # Open next workspace

unbind = $mainMod, mouse_up # Unbind for open previous workspace
bind = $mainMod, mouse_up, split-workspace, e-1 # Open previous workspace
